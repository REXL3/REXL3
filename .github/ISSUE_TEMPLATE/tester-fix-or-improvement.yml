name: Tester finding, fix, or feature proof
description: Submit a root-cause finding, bug fix, or coded & locally validated feature/optimization proof (git diff required)
title: "[finding] "
body:
  - type: markdown
    attributes:
      value: |
        Use this template to submit a technical root-cause finding, a concrete bug fix, or a **coded and locally validated feature/runtime/kernel improvement** — whether it targets a **single model family** or the **REXL3 engine as a whole**.
        **No bare feature requests or wishlist tickets:** this repository (`REXL3/REXL3`) ships the full corresponding engine source tree (`crates/`, `Cargo.toml`, `Cargo.lock`, `third_party/`, `SOURCE_BUILD.md`). If you or your agent want to propose a feature, drafter binding, kernel speedup, KV/memory layout change, or runtime improvement, you must **implement it in code, build and test it on your own setup at the profile's full supported context (`262,144` for `tp1` / `1,048,576` for `tp2`), and include the working `git diff` plus measured validation output below** so the maintainers can pull your patch into `REXL3/REXL3-dev`, run the qualification gates, and promote it to `REXL3/REXL3`.
        Before opening a new issue, search existing open and closed issues (`gh issue list -R REXL3/REXL3 --state all`) and read any related open issue in full (`gh issue view <N> -R REXL3/REXL3 --comments`) — if an open issue already tracks the same bug or bottleneck, post your root-cause analysis and tested `git diff` as a comment on that issue instead of opening a duplicate.
        If submitting via `gh issue create`, you must still prefix the title with `[finding] ` and include every section below verbatim.
        This repository is public: anyone can read issues, and only invited testers and the maintainers can open or comment on them. Testers submit code via a `git diff` in this issue and do not open pull requests.
        **Do not paste private prompts, credentials, tokens, or SSH keys.**
  - type: input
    id: existing-issues
    attributes:
      label: Open issues and KNOWN_ISSUES.md checked
      description: "List the search query you ran (for example `gh issue list -R REXL3/REXL3 --state all --search ...`) and any related issue numbers (#N) you reviewed before opening this ticket."
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope (per model family vs engine-wide)
      description: Does this finding/fix/feature apply to a specific model family or across the engine as a whole?
      options:
        - "Engine-wide (affects all models: shared CUDA kernels, KV/prefix cache, scheduler, HTTP server, or launcher)"
        - "qwen3.8 / qwen3.8-27b (single-node 262K, DFlash2)"
        - "qwen3.8 / qwen3.8-flash-next (single-node 262K, MTP)"
        - "glm-5.3 / glm-5.3-flash (single-node 262K or two-node tp2 1M)"
        - "nemotron-3.5 / nemotron-3.5-super-vl (single-node 1M, VL + MTP)"
        - "deepseek-v4.1 / deepseek-v4.1-flash-1017 (single-node tp1 262K or two-node tp2 1M)"
        - "ling-3.1 / ling-3.1-flash-1019"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What kind of coded fix or improvement is this?
      options:
        - "Bug root cause & tested fix"
        - "Decode / prefill throughput optimization (tested patch)"
        - "Speculative decoding (MTP / DFlash2) integration or improvement (tested patch)"
        - "KV cache / prefix cache / memory headroom improvement (tested patch)"
        - "Long-context (262K / 1M) stability or exactness fix (tested patch)"
        - "Launcher / runtime script / API ergonomics improvement (tested patch)"
        - "Recipe / profile.json / pack-sheet improvement (tested patch)"
    validations:
      required: true
  - type: input
    id: release-and-profile
    attributes:
      label: Release tag, engine commit, runtime bundle, and profile tested
      description: "For example: v0.1.0 (engine commit afc9b5df), dsv41-flash-1017-sage-1.55-v1-bundle.tar.gz, profile dsv41-single-262k (262,144 context)."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "1. WHY — Finding, root cause, or bottleneck"
      description: |
        Explain WHY this change is needed:
        - What behavior, bottleneck, or failure mode did you find and measure?
        - What is the underlying root cause (e.g. kernel stall, chunk-boundary mismatch, drafter binding, KV layout, launcher check, profile flag)?
        - What is the measured impact on users/testers (tok/s, memory GiB, exactness, usability)?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "2. WHAT — Affected components, files, and contract impact"
      description: |
        Detail WHAT your code patch changes:
        - Which files, crates, scripts, or profile settings are modified (and whether the change is confined to one model family or shared across the engine)?
        - Does it preserve bit-exact output (`drafted == serial`, `chunked == whole`, prefix-cache parity) or change sampling/arithmetic?
    validations:
      required: true
  - type: textarea
    id: patch
    attributes:
      label: "3. HOW TO FIX — Tested code patch (git diff required)"
      description: |
        Paste the complete, working `git diff` built and tested against this repository's engine source tree (`crates/`, `Cargo.toml`, `SOURCE_BUILD.md`) or runtime scripts so maintainers can apply it in `REXL3/REXL3-dev`, validate it, and promote it to `REXL3/REXL3`. Do not submit a feature request without a tested code patch.
      render: diff
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: "4. FULL-CONTEXT VALIDATION EVIDENCE — Commands, exactness, and before/after measurements"
      description: |
        Paste the exact commands and real outputs proving your patch was tested and validated on your setup:
        - Exact build and test/benchmark commands run at the profile's **full supported context** (`262,144` for `tp1` or `1,048,576` for `tp2` — never `32k`).
        - Exactness proof (`drafted == serial`, `chunked == whole`, unit/integration test pass counts).
        - Measured before vs after numbers across 3 runs (live speculative decode tok/s, prefill 50%/100% tok/s, draft acceptance rate, and free GPU memory GiB headroom).
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before sending
      options:
        - label: I searched existing open and closed issues (and KNOWN_ISSUES.md) and confirmed no open issue already covers this finding or fix.
          required: true
        - label: I implemented, built, and validated the attached code patch (git diff) on my own setup at the profile's full supported context (262,144 or 1,048,576) and included the measured before/after evidence above.
          required: true
        - label: This submission contains no credentials, tokens, private prompts, or proprietary data.
          required: true
        - label: This is not a security vulnerability (security issues follow SECURITY.md).
          required: true
