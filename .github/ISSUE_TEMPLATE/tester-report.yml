name: Tester bug or issue report
description: Report a bug, failure, or regression on a model family or across the engine (not a security problem)
title: "[report] "
body:
  - type: markdown
    attributes:
      value: |
        One report per problem. Before opening a new issue, search existing open and closed issues (`gh issue list -R REXL3/REXL3 --state all`)
        and check `KNOWN_ISSUES.md` — if an open issue already covers this symptom, add your findings, diagnostics, or fix as a comment on that issue instead of opening a duplicate.
        This repository is public: anyone can read issues, and only invited testers and the maintainers
        can open or comment on them. **Do not paste raw logs, prompts, responses you want kept private, credentials, tokens or SSH keys.**
        A security problem goes through [SECURITY.md](https://github.com/REXL3/REXL3/blob/main/SECURITY.md), not here. The command list and
        the error-token table are in the [user guide](https://github.com/REXL3/REXL3/blob/main/docs/USER_GUIDE.md).
  - type: input
    id: existing-issues
    attributes:
      label: Open issues and KNOWN_ISSUES.md checked
      description: "List the search query you ran (for example `gh issue list -R REXL3/REXL3 --state all --search ...`) and any related issue numbers (#N) you reviewed to confirm this is not a duplicate."
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope (model family or engine-wide)
      description: Choose whether this issue is specific to one model family/recipe or affects the REXL3 engine/launcher across models.
      options:
        - "Engine-wide (affects multiple models, rexl3-serve, rexl3-cluster, or launch.sh)"
        - "qwen3.8 / qwen3.8-27b (single-node 262K, DFlash2)"
        - "qwen3.8 / qwen3.8-flash-next (single-node 262K, MTP)"
        - "glm-5.3 / glm-5.3-flash (single-node 262K or two-node tp2 1M)"
        - "nemotron-3.5 / nemotron-3.5-super-vl (single-node 1M, VL + MTP)"
        - "deepseek-v4.1 / deepseek-v4.1-flash-1017 (single-node tp1 262K or two-node tp2 1M)"
        - "ling-3.1 / ling-3.1-flash-1019"
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected area
      description: Which part of the runtime or engine is involved?
      options:
        - "Launcher / bundle scripts (launch.sh, doctor, verify, site.json)"
        - "Engine / CUDA kernels (decode, prefill, attention, MoE)"
        - "Speculative decoding (MTP / DFlash2 acceptance or speed)"
        - "KV cache / prefix cache / long context (262K / 1M)"
        - "HTTP / OpenAI API server & streaming"
        - "Model quality / sampling / chat template"
        - "Vision / multimodal input"
        - "Multi-node cluster (rexl3-cluster / TP2)"
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release tag, bundle asset name and SHA-256
      description: "The tag (for example v0.1.0), the bundle asset name (<runtime-id>-v<N>-bundle.tar.gz) and bundle.sha256 from its <runtime-id>-v<N>-approval.json."
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile
      description: The profile you ran (the default if you did not choose one).
    validations:
      required: true
  - type: textarea
    id: why-finding
    attributes:
      label: "1. WHY — Symptom, root cause (if known), and impact"
      description: What broke or regressed, why you believe it happens (if you traced it), and how it impacts your run (crash, wrong output, low tok/s, OOM, etc.).
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "2. WHAT — Expected vs actual behavior and affected component"
      description: What you expected, what happened instead, and which component/file/flag is involved.
    validations:
      required: true
  - type: textarea
    id: how-to-fix
    attributes:
      label: "3. HOW TO REPRODUCE OR FIX — Exact steps, workaround, or proposed fix"
      description: Exact steps to repeat the problem, plus any workaround or fix you found.
    validations:
      required: true
  - type: textarea
    id: start-line
    attributes:
      label: Server start line
      description: "The rexl3 event=start line from the server log: ./launch.sh logs --profile <name> --lines 1000 --no-follow | grep 'rexl3 event=start'. Leave empty if the server never started."
      render: text
  - type: textarea
    id: command
    attributes:
      label: Command, exit code and error token
      description: The exact command, its exit code and the capitalised error token it printed, if any.
      render: shell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Output of ./launch.sh diagnostics
      description: Read it before pasting. It is an allow-list report and contains no prompts, responses, raw logs, environment values or credentials.
      render: json
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: For a bad answer or an HTTP error, the JSON request you sent, with anything private removed. Include the seed if you set one.
      render: json
  - type: textarea
    id: response
    attributes:
      label: Response
      description: The JSON response you got (or the HTTP status and error.message), with anything private removed. Include finish_reason.
      render: json
  - type: textarea
    id: checked
    attributes:
      label: What you checked and what you could not check
      description: For example doctor, status, the pack sheet, KNOWN_ISSUES.md; and anything you could not run on your machine.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before sending
      options:
        - label: I searched existing open and closed issues (and KNOWN_ISSUES.md) and confirmed no open issue already tracks this problem.
          required: true
        - label: I read the diagnostics output and it contains nothing I do not want shared.
          required: true
        - label: This is not a security problem.
          required: true
